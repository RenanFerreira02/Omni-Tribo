spring:
  application:
    name: omnitribo-api
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Credencial PRÓPRIA, com DDL. O datasource acima é o papel restrito da aplicação
    # (omnitribo_app), que por desenho não pode criar schema nem alterar tabela append-only.
    # Sem default, e de propósito: em produção, falta de configuração precisa derrubar o boot em vez
    # de silenciosamente cair num usuário mais poderoso do que deveria.
    url: ${FLYWAY_URL:${DATASOURCE_URL}}
    user: ${FLYWAY_USERNAME}
    password: ${FLYWAY_PASSWORD}
  jackson:
    deserialization:
      # Decisão explícita, não default acidental: campo desconhecido no corpo é IGNORADO, não
      # rejeitado. Os DTOs de request declaram só o que pode ser alterado — enviar status,
      # executorId ou xpRecompensa num PATCH não tem efeito algum (proteção contra mass
      # assignment). Rejeitar com 400 dificultaria evolução do app sem ganho de segurança.
      fail-on-unknown-properties: false

management:
  server:
    # Porta de gestão separada da 8080 de propósito (ver SecurityConfig.actuatorFilterChain).
    # NÃO use 8081: é a porta default do Metro/Expo, e o dev que roda backend e app ao mesmo tempo
    # perde o segundo a subir com "BindException: address already in use" — no caso do Spring, o
    # contexto de management derruba a aplicação INTEIRA, sem nenhuma pista de que a culpa é do
    # Metro. A 8081 continua listada em app.cors.origens-permitidas justamente por ser do Expo web.
    port: 8090
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

server:
  port: 8080
  tomcat:
    remoteip:
      # QUEM pode dizer de onde a requisição veio. Vazio = ninguém: getRemoteAddr() é o peer TCP
      # real, e X-Forwarded-For é ignorado. Em produção, preencha com o CIDR do proxy de verdade
      # (ex.: "10\.0\.\d+\.\d+") — é a RemoteIpValve do Tomcat, que só honra o header quando o
      # último salto está nesta lista.
      #
      # Deixar isto vazio é a POSTURA SEGURA, e é o oposto de `forward-headers-strategy:
      # FRAMEWORK/NATIVE`, que faria getRemoteAddr() honrar o header de qualquer um. A chave do
      # bloqueio progressivo de login é sha256(ip + email): com o IP saindo de um header que o
      # cliente escolhe, cada tentativa teria uma chave nova e o bloqueio de 5/min nunca acumularia.
      # Ver EnderecoDoCliente e ADR 0019.
      trusted-proxies: ${TRUSTED_PROXIES:}
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"

app:
  jwt:
    # Paths relativos ao diretório de trabalho do processo (services/api/).
    # Sobrescreva com JWT_PRIVATE_KEY_PATH e JWT_PUBLIC_KEY_PATH em produção.
    chave-privada-caminho: ${JWT_PRIVATE_KEY_PATH:keys/private.pem}
    chave-publica-caminho: ${JWT_PUBLIC_KEY_PATH:keys/public.pem}
    ttl-access: PT15M       # Access token: 15 minutos (curto — limita janela de exploração)
    issuer: omnitribo
    audience: omnitribo-app
  cors:
    # Lista explícita de origens — nunca wildcard.
    # Wildcard em CORS anularia a proteção same-origin em browsers.
    origens-permitidas: ${CORS_ORIGENS:http://localhost:8081,exp://localhost:8082}
  rate-limit:
    login-por-minuto: 5          # tentativas de login por IP+email antes de 429
    escrita-por-minuto: 100      # POST/PUT/PATCH/DELETE por usuário autenticado
    leitura-por-minuto: 300      # GET por usuário autenticado
    falhas-para-bloqueio: 10     # falhas consecutivas antes de bloqueio progressivo
    janela-falhas-minutos: 15    # janela de observação para contar falhas
    duracao-bloqueio-minutos: 15 # duração do bloqueio após atingir o limiar
  agendamento:
    # Desligado no perfil de teste: um job mudando status em paralelo tornaria as assertions
    # intermitentes. A regra de expiração continua testada chamando ExpiracaoMissoesJob.varrer().
    habilitado: true
  missoes:
    expiracao:
      intervalo: PT5M            # de quanto em quanto tempo o job varre janelas vencidas
      atraso-inicial: PT1M       # espera o boot estabilizar antes da primeira varredura
      # Prazos das DUAS varreduras que fecham os becos sem saída da máquina de estados. Ver
      # RegraExpiracao — a regra é código, estes números são calibração.
      #
      # Generosos de propósito, e a assimetria do erro é a razão: prazo curto demais tira a missão
      # de quem está executando de boa-fé (trânsito, imprevisto, um dia ruim); prazo longo demais só
      # adia a devolução de um pote que, sem varredura nenhuma, ficaria preso PARA SEMPRE.
      prazo-execucao: PT48H      # EM_ANDAMENTO sem check-in → EXPIRADA, estorna o pote
      prazo-confirmacao: PT72H   # AGUARDANDO_CONFIRMACAO sem resposta → CONCLUIDA, PAGA o executor
    # Calibração da fórmula de recompensa. A FÓRMULA é código (CalculadoraDeRecompensa); os NÚMEROS
    # são configuração, porque a relação esforço↔recompensa se ajusta com uso real.
    #
    # MUDOU QUALQUER NÚMERO AQUI? SUBA `versao` JUNTO. Sem isso, missões antigas passam a ser
    # explicadas por uma calibração que não as produziu, e some a resposta para "este crédito estava
    # certo quando foi feito?". CalculadoraDeRecompensaTest.douradoV1 falha de propósito para forçar
    # essa decisão.
    recompensa:
      versao: 1
      base-tokens:                 # piso por categoria, antes de multiplicador e adicionais
        ENTREGA: 20
        COLETA: 20
        TRIBO: 25                  # mutirão mobiliza mais gente e costuma durar mais
        AJUDA: 20
      multiplicador-complexidade:
        LEVE: 1.0
        MEDIA: 1.5
        PESADA: 2.0
      tokens-por-km: 2             # deslocamento é o custo mais visível para quem executa
      tokens-por-kg: 0.5
      tokens-por-cem-litros: 5     # volume conta separado do peso: isopor grande não cabe em moto
      # Teto por missão. Continua existindo mesmo com a fórmula fechada, porque peso e volume ainda
      # vêm do request — é o herdeiro do @Max(1000) que antes era o ÚNICO controle.
      teto-tokens: 1000
      xp-por-token: 3              # XP é reputação: não circula, não tem ledger, não afeta conservação
      teto-xp: 5000
      # Fronteiras da derivação de complexidade. Decide o MAIOR dos dois: peso alto OU volume alto
      # já classifica acima.
      peso-leve-ate-kg: 5
      volume-leve-ate-l: 20
      peso-media-ate-kg: 25
      volume-media-ate-l: 80
  carteira:
    # Os tetos não existem para limitar uso legítimo — existem para limitar o DANO de uma conta
    # comprometida. Quem rouba um access token pode transferir; o teto por transação impede
    # esvaziar a carteira num único POST, e o teto por janela impede o mesmo esvaziamento fatiado
    # em N requisições. Um sem o outro é contornável de forma trivial.
    transferencia-teto-por-transacao: 500      # tokens por transferência
    transferencia-teto-por-janela: 2000        # tokens somados na janela abaixo
    transferencia-janela: PT24H
    saque-minimo-brl: 10.00                    # abaixo disso a taxa do gateway inviabiliza
    # Saque DESLIGADO desde o ADR 0009: BRL deixou de ser recompensa de missão, então não há
    # mais como ganhá-lo. Manter aberto sacaria saldo herdado de um modelo que não vale mais.
    # A implementação continua no lugar e testada, para a conversão patrocinada de TOKEN.
    saque-habilitado: false
  outbox:
    intervalo: PT10S             # varredura frequente: é latência de notificação, não de dados
    atraso-inicial: PT30S
    maximo-tentativas: 5         # depois disso o evento sai do lote e espera intervenção
    backoff-base: PT30S          # exponencial: 30s, 1min, 2min, 4min, 8min

  identidade:
    # Conquistas DERIVADAS de xp/nivel/streak — não há tabela. A FÓRMULA é código
    # (CalculadoraDeConquistas), os NÚMEROS são estes. Mudar um limiar aqui concede medalhas
    # retroativamente, ou REVOGA medalhas que o usuário já exibia — e, como nada é gravado, não há
    # onde congelar a calibração vigente para explicar a mudança depois. O teste dourado falha de
    # propósito para forçar a decisão consciente.
    conquistas:
      # Sem `versao`: conquista é DERIVADA e recalculada a cada leitura, então não há linha em banco
      # que uma versão pudesse explicar depois. Mudar um limiar aqui concede ou REVOGA medalhas
      # retroativamente — ver ParametrosConquistas.
      xp-iniciante: 1              # a primeira missão concluída já concede XP
      xp-vizinho-presente: 500
      xp-pilar-da-tribo: 2000
      nivel-veterano: 10           # 8100 de XP pela curva quadrática de RegraNivel
      streak-constante: 7

  # Provedores EXTERNOS (ADR 0011). Os dois foram escolhidos por não exigirem chave de API:
  # nenhuma credencial nova entra no projeto, e .env.example continua descrevendo tudo.
  integracoes:
    # Vale para os dois clientes. Curto de propósito: sem timeout, um provedor que aceita a conexão
    # e não responde prende a thread da requisição, e sob carga isso esgota o pool do servlet — o
    # card de clima derrubaria o login.
    timeout: PT2S
    # `chamadas-simultaneas` é o bulkhead: teto de chamadas SIMULTÂNEAS, com um contador POR
    # provedor — o CEP fora do ar não consome as permissões do clima. O timeout acima limita quanto
    # cada chamada espera; este limita QUANTAS esperam ao mesmo tempo. Sem ele, provedor lento +
    # cache que deliberadamente não guarda falha = toda requisição segurando uma thread do servlet
    # por 2 s, até o pool acabar. Ver LimiteDeChamadasExternas.
    clima:
      base-url: ${CLIMA_BASE_URL:https://api.open-meteo.com}
      # 10 min: a previsão do provedor não muda mais rápido que isso, e o TTL é o que impede uma
      # tela de mapa aberta de virar uma chamada externa por movimento de dedo.
      ttl: PT10M
      chamadas-simultaneas: 8
    endereco:
      base-url: ${CEP_BASE_URL:https://viacep.com.br}
      chamadas-simultaneas: 8
      # Sem TTL de propósito: logradouro de um CEP muda uma vez por década. Só o teto de entradas
      # do Caffeine governa o despejo. Ver EnderecoService.
