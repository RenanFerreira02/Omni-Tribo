spring:
  application:
    name: omnitribo-api
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Credencial PRÓPRIA, com DDL. O datasource acima é o papel restrito da aplicação
    # (omnitribo_app), que por desenho não pode criar schema nem alterar tabela append-only.
    # Sem default, e de propósito: em produção, falta de configuração precisa derrubar o boot em vez
    # de silenciosamente cair num usuário mais poderoso do que deveria.
    url: ${FLYWAY_URL:${DATASOURCE_URL}}
    user: ${FLYWAY_USERNAME}
    password: ${FLYWAY_PASSWORD}
  jackson:
    deserialization:
      # Decisão explícita, não default acidental: campo desconhecido no corpo é IGNORADO, não
      # rejeitado. Os DTOs de request declaram só o que pode ser alterado — enviar status,
      # executorId ou xpRecompensa num PATCH não tem efeito algum (proteção contra mass
      # assignment). Rejeitar com 400 dificultaria evolução do app sem ganho de segurança.
      fail-on-unknown-properties: false

management:
  server:
    # Porta de gestão separada da 8080 de propósito (ver SecurityConfig.actuatorFilterChain).
    # NÃO use 8081: é a porta default do Metro/Expo, e o dev que roda backend e app ao mesmo tempo
    # perde o segundo a subir com "BindException: address already in use" — no caso do Spring, o
    # contexto de management derruba a aplicação INTEIRA, sem nenhuma pista de que a culpa é do
    # Metro. A 8081 continua listada em app.cors.origens-permitidas justamente por ser do Expo web.
    port: 8090
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

server:
  port: 8080
  tomcat:
    remoteip:
      # QUEM pode dizer de onde a requisição veio. Vazio = ninguém: getRemoteAddr() é o peer TCP
      # real, e X-Forwarded-For é ignorado. Em produção, preencha com o CIDR do proxy de verdade
      # (ex.: "10\.0\.\d+\.\d+") — é a RemoteIpValve do Tomcat, que só honra o header quando o
      # último salto está nesta lista.
      #
      # Deixar isto vazio é a POSTURA SEGURA, e é o oposto de `forward-headers-strategy:
      # FRAMEWORK/NATIVE`, que faria getRemoteAddr() honrar o header de qualquer um. A chave do
      # bloqueio progressivo de login é sha256(ip + email): com o IP saindo de um header que o
      # cliente escolhe, cada tentativa teria uma chave nova e o bloqueio de 5/min nunca acumularia.
      # Ver EnderecoDoCliente e ADR 0019.
      trusted-proxies: ${TRUSTED_PROXIES:}
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"

app:
  jwt:
    # Paths relativos ao diretório de trabalho do processo (services/api/).
    # Sobrescreva com JWT_PRIVATE_KEY_PATH e JWT_PUBLIC_KEY_PATH em produção.
    chave-privada-caminho: ${JWT_PRIVATE_KEY_PATH:keys/private.pem}
    chave-publica-caminho: ${JWT_PUBLIC_KEY_PATH:keys/public.pem}
    ttl-access: PT15M       # Access token: 15 minutos (curto — limita janela de exploração)
    issuer: omnitribo
    audience: omnitribo-app
  cors:
    # Lista explícita de origens — nunca wildcard.
    # Wildcard em CORS anularia a proteção same-origin em browsers.
    origens-permitidas: ${CORS_ORIGENS:http://localhost:8081,exp://localhost:8082}
  rate-limit:
    login-por-minuto: 5          # tentativas de login por IP+email antes de 429
    escrita-por-minuto: 100      # POST/PUT/PATCH/DELETE por usuário autenticado
    leitura-por-minuto: 300      # GET por usuário autenticado
    # Teto PRÓPRIO de GET /usuarios/busca, e não um recorte do de leitura: aquele endpoint responde
    # "este @ está na minha tribo?", o que o torna um oráculo de existência por natureza. No balde
    # geral seriam 18 mil tentativas por hora — o bastante para colher handles em massa. Doze por
    # minuto é folgado para gente digitando um @ e conferindo o nome. Ver ADR 0028.
    busca-handle-por-minuto: 12
    falhas-para-bloqueio: 10     # falhas consecutivas antes de bloqueio progressivo
    janela-falhas-minutos: 15    # janela de observação para contar falhas
    duracao-bloqueio-minutos: 15 # duração do bloqueio após atingir o limiar
  agendamento:
    # Desligado no perfil de teste: um job mudando status em paralelo tornaria as assertions
    # intermitentes. A regra de expiração continua testada chamando ExpiracaoMissoesJob.varrer().
    habilitado: true
  missoes:
    expiracao:
      intervalo: PT5M            # de quanto em quanto tempo o job varre janelas vencidas
      atraso-inicial: PT1M       # espera o boot estabilizar antes da primeira varredura
      # Prazos das DUAS varreduras que fecham os becos sem saída da máquina de estados. Ver
      # RegraExpiracao — a regra é código, estes números são calibração.
      #
      # Generosos de propósito, e a assimetria do erro é a razão: prazo curto demais tira a missão
      # de quem está executando de boa-fé (trânsito, imprevisto, um dia ruim); prazo longo demais só
      # adia a devolução de um pote que, sem varredura nenhuma, ficaria preso PARA SEMPRE.
      prazo-execucao: PT48H      # EM_ANDAMENTO sem check-in → EXPIRADA, estorna o pote
      prazo-confirmacao: PT72H   # AGUARDANDO_CONFIRMACAO sem resposta → CONCLUIDA, PAGA o executor
    # Calibração da fórmula de recompensa. A FÓRMULA é código (CalculadoraDeRecompensa); os NÚMEROS
    # são configuração, porque a relação esforço↔recompensa se ajusta com uso real.
    #
    # MUDOU QUALQUER NÚMERO AQUI? SUBA `versao` JUNTO. Sem isso, missões antigas passam a ser
    # explicadas por uma calibração que não as produziu, e some a resposta para "este crédito estava
    # certo quando foi feito?". CalculadoraDeRecompensaTest.douradoV1 falha de propósito para forçar
    # essa decisão.
    recompensa:
      # versao 3: a fórmula passou a aceitar um MULTIPLICADOR DE RISCO, que multiplica a base junto
      # da complexidade. Missões criadas por usuário recebem 1,00 (neutro) e continuam valendo
      # exatamente o que valiam na v2 — CalculadoraDeRecompensaTest.semRiscoAV3ReproduzAV2 prova
      # isso. Só o caminho do webhook de entrega falida produz multiplicador diferente de 1.
      #
      # versao 2: a fórmula passou a considerar `tokens-por-real-ofertado`, o valor que a
      # transportadora declara no webhook de entrega falida. Toda missão criada antes desta mudança
      # tem versao_formula = 1 gravada e continua explicada pela calibração que a produziu — é
      # exatamente para isso que a coluna existe. CalculadoraDeRecompensaTest tem um dourado por
      # versão; mexer nos números abaixo sem subir este campo faz o dourado falhar de propósito.
      versao: 3
      base-tokens:                 # piso por categoria, antes de multiplicador e adicionais
        ENTREGA: 20
        COLETA: 20
        TRIBO: 25                  # mutirão mobiliza mais gente e costuma durar mais
        AJUDA: 20
      multiplicador-complexidade:
        LEVE: 1.0
        MEDIA: 1.5
        PESADA: 2.0
      tokens-por-km: 2             # deslocamento é o custo mais visível para quem executa
      tokens-por-kg: 0.5
      tokens-por-cem-litros: 5     # volume conta separado do peso: isopor grande não cabe em moto
      # Meio token por real que um TERCEIRO oferta (transportadora, no webhook de entrega falida).
      # Baixo de propósito: ordena missões por urgência sem virar cotação token→real, que o ADR
      # 0009 §6 recusa fixar em qualquer ponto do produto. Zero efeito em missão criada por usuário.
      tokens-por-real-ofertado: 0.5
      # Teto por missão. Continua existindo mesmo com a fórmula fechada, porque peso e volume ainda
      # vêm do request — é o herdeiro do @Max(1000) que antes era o ÚNICO controle.
      teto-tokens: 1000
      xp-por-token: 3              # XP é reputação: não circula, não tem ledger, não afeta conservação
      teto-xp: 5000
      # Fronteiras da derivação de complexidade. Decide o MAIOR dos dois: peso alto OU volume alto
      # já classifica acima.
      peso-leve-ate-kg: 5
      volume-leve-ate-l: 20
      peso-media-ate-kg: 25
      volume-media-ate-l: 80
      # Faixa do multiplicador de risco que a ECONOMIA aceita honrar. Precisa concordar com
      # app.logistica.risco.multiplicador-* — CoerenciaTetoRiscoTest falha se divergirem.
      #
      # Duplicado de propósito: lá o teto define como o MODELO mapeia probabilidade em multiplicador;
      # aqui define quanto a economia se dispõe a CUNHAR. Recalibrar o modelo não deve conseguir,
      # sozinho, ampliar a emissão de token.
      multiplicador-risco-minimo: 1.00
      multiplicador-risco-maximo: 1.50

    # Missão gerada automaticamente a partir de uma entrega falida. Estes números NÃO entram na
    # fórmula de recompensa — não confundir com `recompensa.*` acima, que tem `versao` justamente
    # porque mudá-lo reescreve o significado de missões já criadas. Aqui, mudar só afeta as
    # próximas.
    entrega-falida:
      # Regra de Elegibilidade por Reputação do challenge: custódia de pacote de TERCEIRO não fica
      # visível para toda a base. 2 exige ~100 de XP pela curva de RegraNivel, ou seja, pelo menos
      # uma missão concluída — é a barreira mais baixa que ainda significa "já executou algo aqui".
      nivel-minimo: 2
      # Raio de check-in mais folgado que o padrão: o executor faz o check-in ao ENTREGAR, num
      # endereço residencial cuja coordenada veio da transportadora e não de conferência nossa.
      raio-checkin-m: 200
      # Prazo para alguém aceitar e concluir. Encomenda ocupa vaga física: janela longa demais
      # entope o ponto, e curta demais expira missão que ninguém teve tempo de ver.
      prazo-retirada: PT72H
  carteira:
    # Os tetos não existem para limitar uso legítimo — existem para limitar o DANO de uma conta
    # comprometida. Quem rouba um access token pode transferir; o teto por transação impede
    # esvaziar a carteira num único POST, e o teto por janela impede o mesmo esvaziamento fatiado
    # em N requisições. Um sem o outro é contornável de forma trivial.
    transferencia-teto-por-transacao: 500      # tokens por transferência
    transferencia-teto-por-janela: 2000        # tokens somados na janela abaixo
    transferencia-janela: PT24H
    saque-minimo-brl: 10.00                    # abaixo disso a taxa do gateway inviabiliza
    # Saque DESLIGADO desde o ADR 0009: BRL deixou de ser recompensa de missão, então não há
    # mais como ganhá-lo. Manter aberto sacaria saldo herdado de um modelo que não vale mais.
    # A implementação continua no lugar e testada, para a conversão patrocinada de TOKEN.
    saque-habilitado: false
  outbox:
    intervalo: PT10S             # varredura frequente: é latência de notificação, não de dados
    atraso-inicial: PT30S
    # Depois da quinta falha o evento sai do predicado do lote e NUNCA mais é tentado. Não existe
    # consulta, endpoint nem métrica que mostre um evento esgotado — ele fica na tabela, invisível.
    # Este comentário já dizia "espera intervenção", e não havia com o que intervir (Pendência #4).
    maximo-tentativas: 5
    backoff-base: PT30S          # exponencial: 30s, 1min, 2min, 4min, 8min

  # Webhook de transportadora — a borda do "Fim da Entrega Falida".
  #
  # `segredos` fica VAZIO aqui de propósito. É o único ponto da API que aceita escrita sem JWT, e um
  # segredo padrão versionado seria uma credencial pública: quem clonasse o repositório poderia
  # criar missões e movimentar a ocupação de pontos de custódia em qualquer instalação que não
  # tivesse trocado o valor. Mapa vazio significa "nenhuma transportadora integrada" e todo webhook
  # leva 401 — falha na direção segura.
  #
  # Em produção, uma variável de ambiente por transportadora, que a ligação relaxada do Spring mapeia
  # para a chave do mapa:
  #   APP_WEBHOOKS_SEGREDOS_CORREIOS=<segredo combinado com a transportadora>
  # Os perfis dev e test trazem segredo próprio, que só vale para o carrier-mock.
  webhooks:
    segredos: {}
    # Cinco minutos absorvem deriva de relógio entre servidores sem transformar uma assinatura
    # interceptada em credencial de longa duração.
    janela-timestamp: PT5M
    # Teto por TRANSPORTADORA, não por IP: uma integração em laço de retry não pode consumir a cota
    # das outras. Folgado porque o pico de entregas falidas é concentrado no fim da rota do dia.
    requisicoes-por-minuto: 120

  notificacoes:
    # Raio do alerta de missão nova, medido do ponto de custódia até o CENTRO DA TRIBO do
    # destinatário (usuario não tem coordenada — ver ADR 0020). 3 km é a escala de "meu bairro e o
    # vizinho" na zona oeste de São Paulo, onde o seed vive.
    raio-alerta-metros: 3000
    # Teto por usuário por hora. Sem ele, uma rodada de entregas falidas num ponto movimentado
    # notificaria a mesma pessoa dezenas de vezes em minutos — e a reação a isso é desinstalar o
    # app, não aceitar missão.
    alertas-por-hora: 5
    # Quantas tribos o fan-out considera por evento. Teto de segurança, não de produto: sem ele um
    # ponto numa região densa expandiria um evento em milhares de inserts dentro da transação do
    # lote da outbox.
    tribos-por-evento: 50
    # Teto por hora só para alertas de risco ALTO. A folga sobre `alertas-por-hora` existe para que
    # cinco entregas triviais chegando antes não silenciem a difícil pela hora seguinte — que é a que
    # mais precisa de alguém e a que paga melhor. Folga, não isenção.
    alertas-alta-prioridade-por-hora: 8

  identidade:
    # Conquistas DERIVADAS de xp/nivel/streak — não há tabela. A FÓRMULA é código
    # (CalculadoraDeConquistas), os NÚMEROS são estes. Mudar um limiar aqui concede medalhas
    # retroativamente, ou REVOGA medalhas que o usuário já exibia — e, como nada é gravado, não há
    # onde congelar a calibração vigente para explicar a mudança depois. O teste dourado falha de
    # propósito para forçar a decisão consciente.
    conquistas:
      # Sem `versao`: conquista é DERIVADA e recalculada a cada leitura, então não há linha em banco
      # que uma versão pudesse explicar depois. Mudar um limiar aqui concede ou REVOGA medalhas
      # retroativamente — ver ParametrosConquistas.
      xp-iniciante: 1              # a primeira missão concluída já concede XP
      xp-vizinho-presente: 500
      xp-pilar-da-tribo: 2000
      nivel-veterano: 10           # 8100 de XP pela curva quadrática de RegraNivel
      streak-constante: 7

  # Provedores EXTERNOS (ADR 0011). Os dois foram escolhidos por não exigirem chave de API:
  # nenhuma credencial nova entra no projeto, e .env.example continua descrevendo tudo.
  integracoes:
    # Vale para os dois clientes. Curto de propósito: sem timeout, um provedor que aceita a conexão
    # e não responde prende a thread da requisição, e sob carga isso esgota o pool do servlet — o
    # card de clima derrubaria o login.
    timeout: PT2S
    # Disjuntor (circuit breaker). COMPARTILHADO pelos dois provedores, ao contrário de
    # `chamadas-simultaneas`: o detector de saúde não depende do formato do tráfego de cada um, só do
    # que significa um provedor estar doente. Duas calibrações separadas seriam dois números que
    # ninguém ajustaria. As INSTÂNCIAS continuam sendo uma por provedor — o CEP fora do ar não abre o
    # circuito do clima. Ver DisjuntorDeChamadasExternas e ADR 0023.
    disjuntor:
      # Falhas CONSECUTIVAS. Qualquer sucesso zera. Cinco é curto o bastante para reagir em segundos
      # a uma queda e longo o bastante para não abrir por um soluço isolado.
      falhas-para-abrir: 5
      # Quanto o circuito fica aberto antes de deixar UMA sonda passar. Trinta segundos é o tempo
      # típico de um reinício do lado deles, e o custo de errar para mais é só o recurso continuar
      # escondido por mais um ciclo.
      espera-aberto: PT30S
    retry:
      # REPETIÇÕES, não tentativas: 1 aqui significa 2 idas ao provedor. Com timeout de 2 s cada,
      # mais que isso empurraria a espera do usuário para além de 6 s antes de um 503.
      repeticoes: 1
      # Precisa ser declarada: o default do Framework 7 é 1 s, e herdá-lo dobraria o pior caso sem
      # que ninguém tivesse decidido isso.
      espera: PT0.2S
      # Dessincroniza rajadas: sem jitter, N threads que falharam juntas repetem juntas.
      jitter: PT0.05S
    # `chamadas-simultaneas` é o bulkhead: teto de chamadas SIMULTÂNEAS, com um contador POR
    # provedor — o CEP fora do ar não consome as permissões do clima. O timeout acima limita quanto
    # cada chamada espera; este limita QUANTAS esperam ao mesmo tempo. Sem ele, provedor lento +
    # cache que deliberadamente não guarda falha = toda requisição segurando uma thread do servlet
    # por 2 s, até o pool acabar. Ver LimiteDeChamadasExternas.
    clima:
      base-url: ${CLIMA_BASE_URL:https://api.open-meteo.com}
      # 10 min: a previsão do provedor não muda mais rápido que isso, e o TTL é o que impede uma
      # tela de mapa aberta de virar uma chamada externa por movimento de dedo.
      ttl: PT10M
      chamadas-simultaneas: 8
    endereco:
      base-url: ${CEP_BASE_URL:https://viacep.com.br}
      chamadas-simultaneas: 8
      # Sem TTL de propósito: logradouro de um CEP muda uma vez por década. Só o teto de entradas
      # do Caffeine governa o despejo. Ver EnderecoService.
  logistica:
    # Modelo de previsão de risco de falha de entrega. O MODELO é código (PrevisorDeRisco,
    # CodificadorEntrega, CaracteristicaRisco); os números abaixo são o ARTEFATO TREINADO.
    #
    # NÃO EDITE À MÃO. Saíram de TreinadorRegressaoLogistica sobre o dataset sintético de semente
    # 20260814, e ModeloRiscoTreinoTest re-treina no `verify` e confere cada valor contra o que está
    # aqui. Mexer num número sem re-treinar quebra o build — de propósito, no mesmo espírito de
    # CalculadoraDeRecompensaTest.douradoV1. Para republicar: bash tools/dataset/gerar.sh
    #
    # HONESTIDADE: estes coeficientes foram aprendidos de dados SINTÉTICOS, com correlações que nós
    # mesmos injetamos e documentamos em docs/qualidade/modelo-previsao.md. Isto demonstra um
    # mecanismo; não é um modelo validado contra a operação real. Ver ADR 0022.
    risco:
      # MUDOU QUALQUER NÚMERO ABAIXO? SUBA A VERSÃO. O multiplicador derivado daqui é CONGELADO em
      # missao.multiplicador_risco e a probabilidade em entrega_falida.risco_probabilidade — sem a
      # versão, some a resposta para "este multiplicador estava certo quando foi aplicado?".
      versao: 1

      # Log-odds da entrega MÉDIA nas categorias de referência: manhã (06h–11h), dia útil, endereço
      # RESIDENCIAL, e todas as numéricas na média da partição de treino.
      intercepto: -1.839341

      # Numéricas: log-odds por 1 DESVIO-PADRÃO. Indicadores: log-odds pela presença, relativo à
      # categoria de referência. Falta alguma? O boot falha, em vez de virar coeficiente zero.
      coeficientes:
        JANELA_MADRUGADA:           0.230863
        JANELA_TARDE:               0.313348
        JANELA_NOITE:               0.645797
        ENDERECO_COMERCIAL:         0.449118
        ENDERECO_CONDOMINIO:        0.592997
        ENDERECO_RURAL:             0.645820
        FIM_DE_SEMANA:              -0.304030
        COMERCIAL_EM_FIM_DE_SEMANA: 0.977445
        TAXA_HISTORICA_CEP:         0.350997
        PESO_KG:                    0.152186
        VOLUME_L:                   0.000854
        CHUVA_MM:                   0.144731
        TEMPERATURA_C:              0.158474
        TENTATIVAS_ANTERIORES:      0.695670

      # μ e σ da partição de TREINO apenas — calcular sobre o dataset inteiro vazaria informação do
      # conjunto de teste para dentro do modelo e inflaria as métricas publicadas. A média também é
      # o valor de IMPUTAÇÃO: característica ausente entra com z-score 0, contribuição nula.
      padronizacao:
        TAXA_HISTORICA_CEP:     { media: 0.164030, desvio: 0.085876 }
        PESO_KG:                { media: 3.729150, desvio: 3.422221 }
        VOLUME_L:               { media: 48.279303, desvio: 35.463261 }
        CHUVA_MM:               { media: 1.911100, desvio: 4.198148 }
        TEMPERATURA_C:          { media: 22.039900, desvio: 4.618493 }
        TENTATIVAS_ANTERIORES:  { media: 0.423333, desvio: 0.730837 }

      # Escolhido por varredura de 99 limiares na partição de VALIDAÇÃO — nunca na de teste, que
      # reportaria um recall otimista. Regra: maior recall sujeito a precisão >= 0,35.
      #
      # Bem abaixo de 0,50 porque o custo do erro é assimétrico: falso negativo (entrega que vai
      # falhar e passa despercebida) gera missão subvalorizada, sem prioridade e sem aviso; falso
      # positivo custa um prêmio limitado em token e uma notificação. Ver SeletorDeLimiar.
      limiar-alto: 0.19
      # Metade do limiar de decisão. ALTO coincide com "classificado como falha", para a interface
      # nunca dizer ALTO num caso que o modelo classificou como sucesso.
      limiar-medio: 0.10

      # Taxa histórica de falha por prefixo de CEP (3 dígitos), Grande São Paulo. FABRICADAS, não
      # medidas — precisam ser idênticas a GeradorDatasetEntregas.TAXA_POR_FAIXA_CEP, senão o runtime
      # resolveria uma taxa diferente da que o treino viu e o coeficiente deixaria de valer.
      taxa-por-faixa-cep:
        "010": 0.06
        "013": 0.09
        "020": 0.12
        "031": 0.28
        "035": 0.22
        "040": 0.08
        "043": 0.15
        "050": 0.11
        "054": 0.05
        "055": 0.19
        "080": 0.31
        "087": 0.25
      # CEP fora da tabela cai aqui: a média do treino, ou seja, z-score 0 e contribuição nula. Sem
      # histórico daquela faixa o modelo não deve ter opinião, nem para mais nem para menos.
      taxa-cep-padrao: 0.164030

      # Teto do multiplicador de recompensa em TOKEN, aplicado linearmente na probabilidade.
      #
      # ESTREITO DE PROPÓSITO. Missões de ENTREGA hoje CUNHAM token — não pagam de pote —, porque o
      # financiador correto delas é o patrocinador, que ainda não existe (Pendência #1). Sem teto, o
