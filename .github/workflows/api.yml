name: API CI

# O filtro de caminho NÃO fica aqui, e isso é deliberado. Um status obrigatório cujo workflow é
# pulado por `paths:` NUNCA reporta, e o GitHub trava o PR em "Expected — Waiting for status to be
# reported" indefinidamente, sem explicar a causa. Job pulado por `if:` reporta SUCESSO e satisfaz o
# check; workflow pulado por `paths:` não reporta nada. Por isso o gatilho é amplo e a decisão de
# caminho virou o job `mudou` abaixo.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Detecta se algo do backend mudou. Roda sempre, custa segundos.
  mudou:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filtro.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar mudanças no backend
        id: filtro
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
            # Primeiro push de uma branch nova não tem `before` utilizável.
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              echo "backend=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          if git diff --name-only "$base"...HEAD | grep -qE '^(services/api/|\.github/workflows/api\.yml)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: mudou
    if: needs.mudou.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: services/api/pom.xml

      # Sem os PEM o @PostConstruct do JwtService derruba o contexto e TODA a suíte de integração
      # falha no CI enquanto passa localmente.
      - name: Gerar chaves RSA de desenvolvimento
        run: bash tools/gerar-chaves-dev.sh

      # `verify` inclui: testes, ArchUnit, Spotless, SpotBugs (falha a partir de Medium) e os dois
      # gates de cobertura do JaCoCo (80% global, 85% agregado no domínio).
      - name: Build, testes e gates de qualidade
        run: cd services/api && ./mvnw verify

      - name: Upload relatório JaCoCo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: services/api/target/site/jacoco/
          retention-days: 30

      - name: Upload relatórios de teste
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: services/api/target/surefire-reports/
          retention-days: 30
