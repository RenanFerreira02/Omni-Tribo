name: Security Scan

# Gitleaks em todo push/PR, sobre o histórico completo: um segredo que entrou num commit antigo
# continua alcançável mesmo depois de apagado da árvore.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — varre histórico completo
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
