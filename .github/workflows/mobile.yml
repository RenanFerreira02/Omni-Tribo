name: Mobile CI

# Filtro de caminho no JOB, não no workflow — mesma razão de api.yml: status obrigatório cujo
# workflow é pulado por `paths:` nunca reporta e trava o PR para sempre.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mudou:
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filtro.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar mudanças no mobile
        id: filtro
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              echo "mobile=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          if git diff --name-only "$base"...HEAD | grep -qE '^(apps/mobile/|\.github/workflows/mobile\.yml)'; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: mudou
    if: needs.mudou.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: apps/mobile/.nvmrc
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Instalar dependências
        run: cd apps/mobile && npm ci

      - name: Typecheck
        run: cd apps/mobile && npm run typecheck

      - name: Lint
        run: cd apps/mobile && npm run lint

      # `test:e2e` fica FORA daqui de propósito: exige o backend em execução.
      - name: Testes
        run: cd apps/mobile && npm test -- --ci --coverage --reporters=default --reporters=github-actions

      - name: Upload relatório de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-mobile
          path: apps/mobile/coverage/
          retention-days: 30
