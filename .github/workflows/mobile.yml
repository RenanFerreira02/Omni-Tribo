name: Mobile CI

on:
  push:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile.yml'
  # Permite re-rodar pela UI/CLI sem commit. O filtro `paths` acima é bom (não gasta runner em
  # mudança de backend), mas tem o efeito colateral de tornar impossível re-testar uma correção de
  # ambiente sem sujar o histórico com um commit que toque `apps/mobile/**`.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # A versão vem do `.nvmrc`, não de um literal aqui: com o número em dois lugares, a máquina do
      # desenvolvedor e o runner derivam sem ninguém perceber, e a diferença só aparece como teste
      # vermelho que não reproduz localmente.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: apps/mobile/.nvmrc
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      # `npm ci` e não `npm install`: respeita o package-lock à risca. É o que garante que o CI
      # exercite exatamente as versões que o desenvolvedor testou — inclusive os pinos nativos que
      # o `expo install` resolveu a partir do SDK 57.
      - name: Instalar dependências
        run: cd apps/mobile && npm ci

      - name: Typecheck
        run: cd apps/mobile && npm run typecheck

      - name: Lint
        run: cd apps/mobile && npm run lint

      # `--reporters=github-actions` faz cada teste que falha virar uma ANNOTATION, com arquivo e
      # linha. Duas consequências: a falha aparece inline no diff do PR em vez de enterrada no log,
      # e — o que motivou incluir isto — a annotation é exposta pela API pública do GitHub, enquanto
      # o conteúdo do log exige autenticação. Diagnosticar CI vermelho deixa de depender de quem tem
      # login no repositório.
      - name: Testes
        run: cd apps/mobile && npm test -- --ci --coverage --reporters=default --reporters=github-actions

      - name: Upload relatório de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-mobile
          path: apps/mobile/coverage/
          retention-days: 30
